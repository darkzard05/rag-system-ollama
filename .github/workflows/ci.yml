name: RAG System CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'requirements/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'config.yml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'requirements/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'config.yml'
      - '.pre-commit-config.yaml'

permissions:
  contents: read

# Every job delegates to scripts/maintenance/ci_parity.py. The local pre-push
# hook runs the exact same script (--stage pre-push), so a green hook guarantees
# a green CI by construction. Do not inline tool commands here; add them to the
# script instead (tests/unit/test_ci_parity_contract.py enforces this).
jobs:
  lint-and-static-analysis:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Linting Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.15.1 mypy==1.15.0 types-PyYAML types-psutil types-requests

    - name: Run Static Gates (ruff + mypy)
      run: python scripts/maintenance/ci_parity.py --only static

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Run Security Gates (bandit + pip-audit)
      run: python scripts/maintenance/ci_parity.py --only security

  test:
    # Single-job, single-environment CI. The local pre-push hook
    # (.pre-commit-config.yaml) runs the exact same gates via ci_parity.py, on
    # the developer's Windows + Python 3.11 environment, so a green hook
    # guarantees a green CI here.
    name: Test (Windows Py 3.11)
    needs: [lint-and-static-analysis, security-scan]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      IS_CI_TEST: "true"
      TEST_API_KEY: "sk_admin_test_token_12345"
      CUDA_VISIBLE_DEVICES: ""
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest-cov pytest-asyncio pytest-timeout
        if (Test-Path requirements-win.txt) { pip install -r requirements-win.txt }
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    # CI parity: the exact same test commands as the local pre-push hook.
    - name: Run Tests (CI parity with pre-push hook)
      run: python scripts/maintenance/ci_parity.py --only tests

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-win-py3.11
        path: |
          logs/*.log
          coverage.xml
