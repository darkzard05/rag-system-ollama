name: RAG System CI

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'requirements/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'config.yml'
      - '.pre-commit-config.yaml'
      - 'requirements.txt'
      - 'requirements-win.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'src/**'
      - 'requirements/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'config.yml'
      - '.pre-commit-config.yaml'
      - 'requirements.txt'
      - 'requirements-win.txt'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

# Every gating job delegates to scripts/maintenance/ci_parity.py. The local
# pre-push hook runs the same gate commands through the same script. CI also
# runs setup, install, and artifact upload steps. Branch protection is what
# makes CI block merges; a green hook does not guarantee a green CI run.
# Do not inline tool commands here; add them to the script instead
# (tests/unit/test_ci_parity_contract.py enforces this).
jobs:
  lint-and-static-analysis:
    name: Linting & Type Checking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        # docs-drift derives Last Updated from git log over source paths.
        # A shallow checkout has no history for those paths and yields "unknown".
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Gate Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/ci-tools.txt

    - name: Run Static Gates (ruff + mypy)
      run: python scripts/maintenance/ci_parity.py --only static

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Gate Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/ci-tools.txt

    - name: Run Security Gates (bandit + pip-audit)
      run: python scripts/maintenance/ci_parity.py --only security

  test:
    # Single-job, single-environment CI. The local pre-push hook runs the same
    # gate commands via ci_parity.py. CI also performs setup, install, and log
    # upload. Branch protection is what makes a failed CI job block a merge.
    name: Test (Windows Py 3.11)
    needs: [lint-and-static-analysis, security-scan]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      IS_CI_TEST: "true"
      TEST_API_KEY: "sk_admin_test_token_12345"
      CUDA_VISIBLE_DEVICES: ""
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements/ci-tools.txt
        if (Test-Path requirements-win.txt) { pip install -r requirements-win.txt }
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    # CI parity: the exact same test commands as the local pre-push hook.
    - name: Run Tests (CI parity with pre-push hook)
      run: python scripts/maintenance/ci_parity.py --only tests

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-win-py3.11
        path: |
          logs/*.log
          coverage.xml
