name: RAG System Extended (non-gating)

# Tier 2 coverage that is too slow, needs a browser, or needs real Ollama models.
# This workflow runs nightly and on demand only, and every job is
# continue-on-error. The gating commands run locally and in ci.yml through
# ci_parity.py; this workflow uses the same runner for non-gating tiers. CI also
# runs setup, install, and upload steps. Branch protection is what makes CI
# checks block merges, and this workflow is not a required check.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-windows:
    name: E2E + stability + perf
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      IS_CI_TEST: "true"
      TEST_API_KEY: "sk_admin_test_token_12345"
      CUDA_VISIBLE_DEVICES: ""
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-win.txt
        pip install -r requirements.txt
        pip install playwright

    - name: Install Chromium
      run: python -m playwright install chromium

    - name: Start Streamlit
      shell: pwsh
      run: |
        Start-Process -FilePath "python" `
          -ArgumentList "-m","streamlit","run","src/main.py","--server.port","8501","--server.headless","true" `
          -RedirectStandardOutput "$env:TEMP\ext-app8501.log" `
          -RedirectStandardError  "$env:TEMP\ext-app8501.err" `
          -WindowStyle Hidden

        $ok = $false
        foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            try {
                if ((Invoke-WebRequest "http://127.0.0.1:8501/_stcore/health" -TimeoutSec 5 -UseBasicParsing).Content -eq "ok") {
                    Write-Output "ready after ${i}s"; $ok = $true; break
                }
            } catch { }
        }
        if (-not $ok) { Write-Error "streamlit not healthy after 60 attempts"; exit 1 }

    - name: Run extended gates (non-gating)
      run: python scripts/maintenance/ci_parity.py --only extended

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: extended-logs-win-py3.11
        path: |
          logs/*.log
          ${{ runner.temp }}/ext-app8501.log
          ${{ runner.temp }}/ext-app8501.err

  real-ollama:
    name: Real Ollama integration (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      TEST_API_KEY: "sk_admin_test_token_12345"
      CUDA_VISIBLE_DEVICES: ""
      KMP_DUPLICATE_LIB_OK: "TRUE"
      OMP_NUM_THREADS: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install CPU torch + dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "torch>=2.7.1" --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio pytest-timeout pytest-mock

    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        for i in $(seq 1 30); do
          sleep 1
          if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then echo "ollama ready"; break; fi
          [ "$i" -eq 30 ] && { echo "ollama not healthy" >&2; exit 1; }
        done

    - name: Pull models
      run: |
        ollama pull qwen3:4b-instruct-2507-q4_K_M
        ollama pull nomic-embed-text-v2-moe

    - name: Run real-model integration (non-gating)
      run: python scripts/maintenance/ci_parity.py --only real

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: real-ollama-logs
        path: logs/*.log
