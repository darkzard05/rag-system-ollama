# Hook layout is deliberately small:
#   pre-commit : ruff only (fast, file-scoped feedback while editing)
#   pre-push   : ONE ci-parity hook that runs every gating command
#
# ci-parity (scripts/maintenance/ci_parity.py) is the single source of truth and
# is invoked by the GitHub Actions jobs too (--only static/security/tests), so
# "pre-push green" => "CI green" holds by construction rather than by keeping
# two lists in sync by hand. The runner also enforces per-step timeouts and kills
# the whole process tree, so the hook cannot hang forever.
repos:
# 1. Ruff (lint + format) at commit time
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
    -   id: ruff-check
        args: [ --fix ]
        stages: [pre-commit]
    -   id: ruff-format
        stages: [pre-commit]

# 2. Gating checks at push time (ruff, mypy, bandit, pip-audit, tests)
-   repo: local
    hooks:
    # Runs the same commands as all three CI jobs. mypy/bandit/pip-audit use the
    # active environment (`language: system`) so they match CI, which installs
    # them into the same interpreter that runs the tests.
    -   id: ci-parity
        name: ci-parity (ruff, mypy, bandit, pip-audit, tests)
        entry: python scripts/maintenance/ci_parity.py --stage pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

    # Fast requirements consistency check (only when requirements changed).
    -   id: verify-requirements
        name: verify-requirements
        entry: python scripts/maintenance/verify_requirements.py
        language: system
        files: ^requirements/.*\.txt$
        pass_filenames: false
        stages: [pre-push]
