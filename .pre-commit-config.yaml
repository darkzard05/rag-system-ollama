# Hook layout is deliberately small:
#   pre-commit : ruff only (fast, file-scoped feedback while editing)
#   pre-push   : ONE ci-parity hook that runs every gating group
#
# The same gate commands run locally and in ci.yml through ci_parity.py. CI also
# runs setup, install, and artifact upload steps. Branch protection is what
# makes CI block merges; a green hook does not guarantee a green CI run.
# The runner enforces per-step timeouts and kills the whole process tree.
repos:
# 1. Ruff (lint + format) at commit time
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
    -   id: ruff-check
        args: [ --fix ]
        stages: [pre-commit]
    -   id: ruff-format
        stages: [pre-commit]

# 2. Gating checks at push time (ruff, mypy, bandit, pip-audit, tests)
-   repo: local
    hooks:
    # Runs the same gate commands as ci.yml. Tools come from the active
    # environment (`language: system`); install the pins from
    # requirements/ci-tools.txt so local and CI versions match.
    -   id: ci-parity
        name: ci-parity (ruff, mypy, bandit, pip-audit, tests)
        entry: python scripts/maintenance/ci_parity.py --stage pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

    # Fast requirements consistency check (only when requirements changed).
    -   id: verify-requirements
        name: verify-requirements
        entry: python scripts/maintenance/verify_requirements.py
        language: system
        files: ^requirements/.*\.txt$
        pass_filenames: false
        stages: [pre-push]
