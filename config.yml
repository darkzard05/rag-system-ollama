# config.yml
# 애플리케이션의 주요 설정을 관리하는 파일입니다.

# --- 모델 설정 ---
models:
  # 기본으로 사용할 Ollama 모델 이름
  default_ollama: "qwen3:4b-instruct-2507-q4_K_M"

  # 기본으로 사용할 임베딩 모델 이름 (Ollama 또는 HuggingFace)
  default_embedding: "nomic-embed-text-v2-moe"
  
  # Ollama 서버 주소 (로컬: http://127.0.0.1:11434, 도커: http://host.docker.internal:11434)
  base_url: "http://127.0.0.1:11434"

  # Ollama 모델의 토큰 생성 제한 (기본값: 4096)
  # -1로 설정하면 모델의 기본 설정 또는 무제한(컨텍스트 윈도우까지)으로 생성합니다.
  ollama_num_predict: 2048

  # Ollama 모델의 온도 설정
  temperature: 0.1

  # Ollama 모델의 컨텍스트 윈도우 설정
  num_ctx: 8192

  # Ollama 모델의 탑-피 설정
  top_p: 0.8
  
  # 모델 캐시 디렉터리
  cache_dir: ".model_cache"

  # 임베딩 모델의 배치 크기
  embedding_batch_size: "auto"

  # 임베딩 모델 실행 디바이스
  embedding_device: "cuda"

  # 모델 캐시에서 유지할 모델의 최대 개수 (LRU 정책 적용)
  max_cached_models: 5

  # 최대 동시 추론 수 (VRAM 보호를 위한 전역 세마포어 값)
  max_concurrent_inference: 1


# --- RAG 파이프라인 설정 ---
rag:
  # 벡터 저장소 캐시 디렉터리
  vector_store_cache_dir: ".model_cache/vector_store_cache"
  
  # 벡터 저장소 엔진 설정 (FAISS 최적화)
  vector_store:
    index_params:
      hnsw_m: 32                  # HNSW 그래프 연결 수 (기본 32)
      quantization_threshold: 5000 # 5000개 이상 문서 시 SQ8 양자화 적용 (메모리 75% 절감)
      use_l2_norm: true           # 코사인 유사도 보장을 위한 L2 정규화 사용 여부

  # 리트리버 설정
  retriever:
    search_type: "similarity"
    search_kwargs:
      k: 25  # 충분한 후보군 확보를 위해 상향
    # BM25와 FAISS의 가중치 기본값
    ensemble_weights: [0.4, 0.6]
    
    # [추가] 동적 가중치 설정 (질문 의도에 따라 자동 조절)
    dynamic_weighting:
      enabled: true
      keyword_weight: 0.8  # 키워드 중심 질문 시 BM25 비중
      semantic_weight: 0.8 # 의미 중심 질문 시 FAISS 비중
      # 키워드/의미 판단용 정규식 및 키워드 목록
      keyword_patterns: ["v?\\d+\\.\\d+(\\.\\d+)?", "[a-zA-Z]+\\d+", "0x[0-9a-fA-F]+"]
      semantic_keywords: ["차이", "작동", "이유", "철학", "설계", "구조", "개념", "설명해", "방법", "무엇", "어떻게", "장단점", "특징", "비교", "요약", "정의", "뭔가요", "뭐예요", "뭘까", "뭐야", "무엇인가요", "뭐죠"]

  # 재순위화(Reranking) 설정
  reranker:
    # [수정] 다국어 지원을 위해 모델 교체 (기존 TinyBERT는 영어 전용)
    model_name: "ms-marco-MultiBERT-L-12"
    # 리랭커 엔진 선택: auto(FlashRank 크로스-인코더 시도 → 실패 시 bi-encoder 폴백) /
    # flashrank(FlashRank 강제) / semantic(bi-encoder 강제, 기존 동작)
    engine: "auto"

  # 텍스트 분할 설정
  text_splitter:
    chunk_size: 500
    chunk_overlap: 100
  
  # 추출 엔진 설정 (PyMuPDF4LLM 최적화)
  parsing:
    # --- 최적화된 추출 파라미터 (Adaptive Parsing 활성화) ---
    table_strategy: "lines_strict" # [추가] 벤치마크 결과 최적 전략
    graphics_limit: 5000           # [추가] 표 유실 방지를 위한 넉넉한 임계값
    fontsize_limit: 3        # 3pt 이하 텍스트 무시
    ignore_code: false       # 코드 블록 보존
    
    # [수정] 하이드레이션 모드 설정
    # precision_clip: 필요한 구역만 정밀 추출 (권장)
    # full: 페이지 전체 좌표 추출 (비효율적)
    # none: 좌표 추출 안 함 (하이라이트 불가)
    hydration_mode: "precision_clip" 
    
    margins: [0, 72, 0, 72]  # [추가] 상하 1인치(72pt) 마진 무시 (헤더/푸터 제거)
    write_images: false

  # 의미론적 분할 설정
  semantic_chunker:
    enabled: true
    breakpoint_threshold_type: "similarity_threshold"
    breakpoint_threshold_value: 0.6
    # 문장 분할 정규식
    sentence_split_regex: "([.!?]\\s+)" 
    min_chunk_size: 200
    max_chunk_size: 1000
    similarity_threshold: 0.6

  # 프롬프트 설정
  prompts:
    # 1. 핵심 페르소나 및 분석 원칙 (The Core Identity)
    analysis_protocol: |
      당신은 업계 최고 수준의 '문서 분석 전문가'입니다. 
      제공된 자료를 바탕으로 질문에 대해 논리적이고 정확하며 신뢰할 수 있는 답변을 생성하는 것이 당신의 사명입니다.

      <Core_Guidelines>
      1. [Language]: 사용자의 질문 언어에 맞추어 답변하십시오. (문서 언어와 무관)
      2. [Groundedness]: **절대 원칙**: 제공된 <Context>에 없는 내용은 절대 답변에 포함하지 마십시오. 외부 지식을 사용하면 정보의 신뢰성이 떨어질 수 있습니다. 모르는 내용은 "문서에 관련 정보가 없습니다"라고 답하십시오.
      3. [Citations]: **필수**: 모든 핵심 정보(수치, 정의, 주장, 비교)는 반드시 `[Section, p.X]` 형태로 인용하십시오. 인용 없는 답변은 불완전한 것으로 간주합니다. 인용은 해당 정보 바로 뒤에 붙이십시오.
      4. [Synthesis]: 흩어져 있는 정보들을 유기적으로 연결하여 질문에 대한 다각도 분석을 수행하십시오. 특히 섹션 간의 관계(원인과 결과, 실험과 결론 등)를 고려하십시오.
      5. [Output Format]: 답변은 자연스러운 한국어 문장으로 작성하되, 각 문장이나 핵심 문단마다 인용을 포함하십시오.
      6. [Concision]: 첫 문장에서 질문에 직접 답하라(핵심부터, 서론·재진술 금지).
      7. [Brevity]: 답변은 한국어 기준 400~600자 내외로 간결하게 작성하되, 근거와 인용([Section, p.X])은 반드시 유지하라.
      8. [Groundedness Reinforcement]: 제공된 문맥에 없는 내용은 추측하지 말고 '제공된 문서에서 확인할 수 없습니다'라고 명시하라(기존 2번 원칙의 강화).
      </Core_Guidelines>

    # 2. 문서 평가(grading) 설정 (Todo 4 — FlashRank 실측 분포 기반, 근거: .omo/evidence/task-4-rag-answer-quality.md)
    grading:
      min_score_to_skip: 0.85   # max_rerank_score가 이 값 이상이면 LLM grade 생략(short-circuit). 실측: 관련 질문 max 0.855~0.908 / 비관련·저신뢰 0.048~0.057 (이분 분포)
      grade_top_n: 3            # doc-only: grade에 전달할 상위 문서 수 상한 (graph_builder.py:358 docs[:3] — 코드 배선 안 함)
      max_retries: 2            # doc-only: rewrite 최대 재시도 횟수 (graph_builder.py:321 retry_count >= 2 — 코드 배선 안 함)


# --- 평가(Evaluation) 설정 ---
evaluation:
  # 평가에 사용할 Ollama 모델 (Judge)
  judge_model: "qwen3:4b-instruct-2507-q4_K_M"


# --- 캐시 보안 설정 ---

cache_security:
  security_level: "medium"
  hmac_secret: null
  trusted_paths:
    - ".model_cache"
  check_permissions: true
  expected_file_mode: 0o644
  expected_dir_mode: 0o755

# --- 전역 캐시 활성화 설정 ---
global_cache:
  # 벡터 저장소(인덱싱 결과) 캐시 사용 여부
  enable_vector_cache: true

# --- 채팅 UI 설정 ---
ui:
  streaming:
    # 스트리밍 청크 대기 타임아웃 (초) — 연속 3회 타임아웃 시 실패 처리.
    # 로컬 Ollama 콜드 스타트(모델 로드/인덱스 빌드) 시 첫 청크까지 오래 걸릴 수
    # 있으므로 30 → 60초로 상향하여 가짜 타임아웃(최대 180초)을 방지합니다.
    timeout_seconds: 60
  # 타임라인 fragment 자동 갱신 주기(초) — 스트리밍 체감 속도와 CPU 부하 트레이드오프
  timeline_poll_seconds: 1.0
  messages:
    pdf_viewer_no_file: "미리볼 PDF가 없습니다. 사이드바에서 파일을 업로드해주세요."
    # 빈 대화 상태의 단일 가이드 (Phase B: 가이드 5→1 통합)
    chat_guide: "PDF를 업로드한 후 질문해 보세요"
    errors:
      ollama_not_running: "Ollama 서버에 연결할 수 없습니다. 서버가 실행 중인지 확인해주세요."
